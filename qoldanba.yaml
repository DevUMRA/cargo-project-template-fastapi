# Qoldanba песочница манифесі (v1). Сипаттамасы: TEMPLATE.md, 3-бөлім.
# Платформа әрқашан береді: PORT, DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD.
version: 1

stack: fastapi

app:
  port: 8000
  healthcheck: /health
  # Бір команда үшін ұсынылатын шектеулер
  resources:
    memory: 384m
    cpus: "0.5"

database:
  engine: postgres
  version: "17"

env:
  JWT_SECRET_KEY: {generate: secret}
  JWT_ALGORITHM: {value: HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: {value: "120"}
